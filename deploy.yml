# Deploy the Easy 2D web app to GitHub Pages.
# On every push to main (or a manual run) this builds web/ with Vite
# and publishes web/dist. The app uses a relative Vite base ('./'), so it
# works under the Pages subpath https://mcpvip1.github.io/EZ/
#
# One-time setup on GitHub (repo owner only):
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# After that, every push to main redeploys automatically.

name: Deploy Easy 2D to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
